                      <button type="button" class="w-full text-left p-2 rounded hover:bg-[var(--surface-hover)] flex items-center gap-2" @click="exportFinancasExcel(); openMore=false">
                        <span x-html="getIcon('excel')"></span> <span>Exportar Excel (.xlsx)</span>
                      </button>
                      <button type="button" class="w-full text-left p-2 rounded hover:bg-[var(--surface-hover)] flex items-center gap-2" @click="exportFinancasPDF(); openMore=false">
                        <span x-html="getIcon('pdf')"></span> <span>Descarregar PDF</span>
                      </button>
                      <button type="button" class="w-full text-left p-2 rounded hover:bg-[var(--surface-hover)] flex items-center gap-2 text-blue-400" @click="finView='auditoria'; openMore=false">
                        <span x-html="getIcon('relatorios')"></span> <span>Auditoria Financeira</span>
                      </button>
                    </div>
                  </div>
                </div>

              <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">
                
                <!-- 1. Saldo em Caixa -->
                <div class="card p-3 space-y-1 cursor-pointer hover:border-[var(--primary)] transition-all" @click="finView='livro_caixa'">
                  <span class="text-[10px] font-bold uppercase tracking-wider text-[var(--text-dim)]"> SALDO TOTAL</span>
                  <p class="text-lg sm:text-xl font-extrabold font-mono text-emerald-400" x-text="fmtMT(getEliteFinSummary().saldoCaixa)"></p>

                </div>

                <!-- 2. Receitas -->
                <div class="card p-3 space-y-1 cursor-pointer hover:border-emerald-500 transition-all" @click="finView='receitas'">

                  <p class="text-lg sm:text-xl font-extrabold font-mono text-emerald-400" x-text="fmtMT(getEliteFinSummary().periodReceitas)"></p>
                  <p class="text-[10px] text-[var(--text-dim)]">No período selecionado</p>

                  <p class="text-[10px] text-[var(--text-dim)]">Custos operacionais</p>
                </div>

                <!-- 4. Lucro Líquido -->
                <div class="card p-3 space-y-1 cursor-pointer hover:border-[var(--accent-gold)] transition-all" @click="finView='analises'">
                  <span class="text-[10px] font-bold uppercase tracking-wider text-[var(--accent-gold)]"> LUCRO</span>
                  <p class="text-lg sm:text-xl font-extrabold font-mono" :class="getEliteFinSummary().lucro >= 0 ? 'text-emerald-400' : 'text-red-400'" x-text="fmtMT(getEliteFinSummary().lucro)"></p>
                  <p class="text-[10px] text-[var(--text-dim)]">Margem: <span class="font-bold" x-text="getEliteFinSummary().margemLucro + '%'"></span></p>
                </div>

                <!-- 5. A Receber -->
                <div class="card p-3 space-y-1 cursor-pointer hover:border-amber-500 transition-all" @click="finView='a_receber'">

                  <p class="text-[10px] text-[var(--text-dim)]"><span class="font-bold text-red-400" x-text="getEliteFinSummary().devedoresCount"></span> clientes devedores</p>
                </div>

                <!-- 6. A Pagar -->
                <div class="card p-3 space-y-1 cursor-pointer hover:border-blue-500 transition-all" @click="finView='a_pagar'">
                  <span class="text-[10px] font-bold uppercase tracking-wider text-blue-400"> A PAGAR</span>
                  <p class="text-lg sm:text-xl font-extrabold font-mono text-blue-400" x-text="fmtMT(getEliteFinSummary().totalAPagar)"></p>
                  <p class="text-[10px] text-[var(--text-dim)]"><span class="font-bold text-amber-400" x-text="getEliteFinSummary().contasPendentesCount"></span> contas pendentes</p>
                </div>
              </div>

                    </div>
                  </div>
                  <div class="card-2 p-2.5 flex items-center justify-between border-l-2 border-l-orange-500">

                      <p class="text-[10px] text-[var(--text-dim)] font-medium"> e-Mola (+258)</p>
                      <p class="font-mono font-bold text-sm text-orange-400" x-text="fmtMT(getEliteFinSummary().methods['e-Mola'])"></p>
                    </div>
                  </div>
                  <div class="card-2 p-2.5 flex items-center justify-between border-l-2 border-l-blue-500">

                      <p class="text-[10px] text-[var(--text-dim)] font-medium"> BIM / BCI / Transf.</p>
                      <p class="font-mono font-bold text-sm text-blue-400" x-text="fmtMT(getEliteFinSummary().methods['Transferência'])"></p>

                  <div class="card-2 p-2.5 flex items-center justify-between border-l-2 border-l-purple-500 col-span-2 sm:col-span-1">

                      <p class="text-[10px] text-[var(--text-dim)] font-medium"> POS / Outros</p>
                      <p class="font-mono font-bold text-sm text-purple-400" x-text="fmtMT(getEliteFinSummary().methods['Outros'])"></p>
