  <template x-teleport="body">
<div x-show="showModalSaida" x-cloak class="app-modal" @click.self="showModalSaida=false" x-transition.opacity role="dialog" aria-modal="true">
    <div class="app-modal-card modal-md p-5 space-y-4 border-2 border-red-500/40 shadow-2xl">
      <div class="flex items-center justify-between border-b border-[var(--border-color)] pb-3">
        <div class="flex items-center gap-2">
          <span x-html="getIcon('arrowUp')"></span>
          <div>
            <h3 class="font-bold text-base text-red-400">Registar Saída / Despesa de Caixa</h3>
            <p class="text-xs text-[var(--text-dim)]">Pagamento de ração, vacinas, salários, energia ou manutenção</p>
          </div>
        </div>
        <button type="button" class="btn btn-ghost btn-xs text-base text-[var(--text-dim)] hover:text-white" @click="showModalSaida=false" aria-label="Fechar"><span x-html="getIcon('x')"></span></button>
      </div>

      <div class="space-y-3 text-xs">
        <div>
          <label class="label block mb-1">Categoria da Despesa</label>
          <select class="input text-xs" x-model="newSaidaCategory">
            <option value="Ração">Ração & Alimentação</option>
            <option value="Pintos">Compra de Pintos de 1 Dia</option>
            <option value="Vacinas">Vacinas & Medicamentos</option>
            <option value="Energia">Energia / Eletricidade / Aquecimento</option>
            <option value="Água">Água & Saneamento</option>
            <option value="Salários">Salários & Mão de Obra</option>
            <option value="Transporte">Transporte & Combustível</option>
            <option value="Embalagens">Embalagens & Sacos</option>
            <option value="Manutenção">Manutenção & Infraestrutura</option>
            <option value="Outros">Outras Despesas</option>
          </select>
        </div>

        <div>
          <label class="label block mb-1">Descrição do Pagamento</label>
          <input type="text" class="input text-xs" placeholder="Ex: Compra de 20 sacos de ração Terminação Higest" x-model="newSaidaDesc">
        </div>

        <div x-show="newSaidaCategory==='Ração'" class="p-3 bg-slate-900/60 rounded-xl border border-slate-700/60 space-y-2">
          <p class="font-bold text-amber-300 text-[11px]"> Integração Automática com Stock</p>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="label block mb-1">Quantidade de Sacos (50kg)</label>
              <input type="number" min="1" class="input text-xs font-bold" placeholder="Qtd Sacos" x-model="newSaidaBagsQty">
            </div>
            <div>
              <label class="label block mb-1">Item de Stock Vinculado</label>
              <select class="input text-xs" x-model="newSaidaStockItemId">
                <template x-for="stk in stockItems.filter(i => i.category==='Ração')" :key="stk.id">
                  <option :value="stk.id" x-text="stk.name + ' (' + stk.qty + ' ' + stk.unit + ' em stock)'"></option>
                </template>
              </select>
            </div>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="label block mb-1">Valor Pago (MT)</label>
            <input type="number" min="0" step="10" class="input text-xs font-bold font-mono text-red-400" placeholder="Ex: 38000" x-model="newSaidaAmount">
          </div>
          <div>
            <label class="label block mb-1">Data da Saída</label>
            <input type="date" class="input text-xs" x-model="newSaidaDate">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="label block mb-1">Forma de Pagamento</label>
            <select class="input text-xs" x-model="newSaidaMethod">
              <option value="Dinheiro">Dinheiro Físico</option>
              <option value="M-Pesa">M-Pesa (+258)</option>
              <option value="e-Mola">e-Mola (+258)</option>
              <option value="Transferência">Transf. Bancária (BIM/BCI)</option>
              <option value="Cheque">Cheque</option>
            </select>
          </div>
          <div>
            <label class="label block mb-1">Estado</label>
            <select class="input text-xs" x-model="newSaidaStatus">
              <option value="Pago">Pago / Liquidado</option>
              <option value="Pendente">Pendente / A Pagar</option>
            </select>
          </div>
        </div>
      </div>

      <div class="flex gap-2 justify-end pt-2 border-t border-[var(--border-color)]">
        <button type="button" class="btn btn-ghost btn-sm text-xs" @click="showModalSaida=false">Cancelar</button>
        <button type="button" class="btn btn-sm text-xs font-bold !bg-red-600 !text-white hover:!bg-red-700" @click="saveModalSaida()">
          <span x-html="getIcon('check')"></span> <span>Guardar Saída</span>
        </button>
      </div>
    </div>
  </div>
</template>

  <!-- Modal: Registar Pagamento de Cliente (Amortização de Dívida) -->

          <div>
            <label class="label block mb-1">Data</label>
            <input type="date" class="input text-xs" x-model="newPayDate">
          </div>
        </div>

        <div>
          <label class="label block mb-1">Método de Recebimento</label>
          <select class="input text-xs" x-model="newPayMethod">

          <span x-html="getIcon('check')"></span> <span>Confirmar Recebimento</span>
        </button>
      </div>
    </div>
  </div>
</template>

  <!-- Modal: Saúde, Medicamentos e Vacinação -->
  <template x-teleport="body">
  <div x-show="showHealthModal" x-cloak class="app-modal" @click.self="showHealthModal=false" @keydown.escape.window="showHealthModal=false" x-transition.opacity role="dialog" aria-modal="true">

        <div class="grid grid-cols-2 gap-3">

        </div>
        <div class="grid grid-cols-3 gap-3">

        </div>

      <div class="flex gap-2 justify-end pt-2 border-t border-[var(--border-color)]"><button type="button" class="btn btn-ghost btn-sm" @click="showHealthModal=false">Cancelar</button><button type="button" class="btn btn-primary btn-sm font-bold" @click="saveHealthLog()">Guardar Registo</button></div>
    </div>
  </div>
  </template>


    <!-- CENTRAL DE NOTIFICAÇÕES -->
    <template x-teleport="body">
      <div x-show="showNotificationsModal" x-cloak class="app-modal" @keydown.escape.window="showNotificationsModal=false" x-transition.opacity role="dialog" aria-modal="true">
        <div class="app-modal-card modal-md shadow-2xl" @click.stop>
          <div class="modal-head">
            <div>
              <p class="eyebrow">CENTRAL</p>
              <h2 class="modal-title">Notificações</h2>
              <p class="modal-subtitle">Acompanhe alertas importantes da exploração.</p>
            </div>
            <button type="button" class="modal-close" @click="showNotificationsModal=false" aria-label="Fechar"><span x-html="getIcon('x')"></span></button>
          </div>
          <div class="notification-list-scroll">
            <template x-for="n in notifications" :key="n.id">
              <button type="button" class="notification-item text-left w-full" :class="'is-' + (n.type || 'info')" @click="openNotification(n)">
                <span class="notification-item-icon" x-html="getIcon(n.type==='critical' ? 'alert' : (n.type==='warning' ? 'alertas' : 'check'))"></span>
                <div class="flex-1 min-w-0">
                  <p class="font-semibold text-sm" x-text="n.title"></p>
                  <p class="text-xs mt-0.5 text-[var(--text-muted)]" x-text="n.message"></p>
                </div>
              </button>
            </template>
            <div x-show="notifications.length===0" class="empty-state-inline">
              <span x-html="getIcon('check')"></span>
              <span>Não há notificações no momento.</span>
            </div>
          </div>
        </div>
      </div>
    </template>
