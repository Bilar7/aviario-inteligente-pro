<template x-if="view==='vendas' && invoicePreviewOpen && invoicePreview">
<!-- MODAL GLOBAL: PRÉ-VISUALIZAÇÃO DA FACTURA DE VENDA -->
<div>
  <div id="invoice-preview-modal" x-show="invoicePreviewOpen && invoicePreview !== null"
       class="fixed inset-0 z-[120] bg-slate-950/75 backdrop-blur-sm flex items-center justify-center p-4"
       @keydown.escape.window="closeSaleInvoice()">
    <div class="invoice-preview-document w-full max-w-3xl max-h-[94vh] overflow-auto rounded-2xl bg-white text-slate-900 shadow-2xl border border-slate-200">
      <div class="sticky top-0 z-20 flex items-center justify-between px-5 py-3 border-b border-slate-200 bg-white">
        <div>
          <p class="text-sm font-black">Factura de venda</p>
          <p class="text-[11px] text-slate-500">Conferência do documento antes de imprimir ou baixar em PDF.</p>
        </div>
        <button type="button" class="btn btn-ghost btn-sm" @click="closeSaleInvoice()">Fechar</button>
      </div>

      <div class="p-6 sm:p-8">
        <div class="rounded-2xl border border-slate-200 overflow-hidden">
          <div class="p-5 sm:p-6 border-b border-slate-200">
            <div class="flex items-start justify-between gap-5">
              <div class="flex items-start gap-4 min-w-0">
                <img :src="invoicePreview && invoicePreview.settings && invoicePreview.settings.companyLogo ? invoicePreview.settings.companyLogo : './assets/icon-192.png'"
                     alt="Logotipo da empresa" class="w-20 h-20 rounded-2xl object-contain border border-slate-200 bg-white p-1 shrink-0">
                <div class="min-w-0">
                  <p class="text-xl font-black break-words" x-text="invoicePreview && invoicePreview.settings ? (invoicePreview.settings.companyLegalName || invoicePreview.settings.farmName || 'Aviário Inteligente Pro') : 'Aviário Inteligente Pro'"></p>
                  <p class="text-xs font-semibold text-emerald-700 mt-0.5" x-text="invoicePreview && invoicePreview.settings ? (invoicePreview.settings.companySubtitle || invoicePreview.settings.tagline || 'Gestão Avícola') : 'Gestão Avícola'"></p>
                  <p class="text-[10px] text-slate-500 mt-2 break-words" x-text="invoicePreview && invoicePreview.settings ? [invoicePreview.settings.companyAddress || invoicePreview.settings.location, invoicePreview.settings.phone, invoicePreview.settings.companyEmail].filter(Boolean).join(' · ') : ''"></p>
                </div>
              </div>
              <div class="text-right shrink-0">
                <p class="text-[10px] font-bold uppercase tracking-[0.16em] text-slate-500">Factura</p>
                <p class="text-base font-black" x-text="invoicePreview ? (invoicePreview.invoiceNumber || 'FT-—') : 'FT-—'"></p>
                <p class="text-[10px] text-slate-500 mt-1" x-text="invoicePreview ? ((invoicePreview.date || '') + (invoicePreview.time ? ' · ' + invoicePreview.time : '')) : ''"></p>
              </div>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 p-5 sm:p-6 border-b border-slate-200 bg-slate-50">
            <div>
              <p class="text-[10px] font-bold uppercase tracking-wide text-slate-500">Cliente</p>
              <p class="text-sm font-bold mt-1" x-text="invoicePreview ? (invoicePreview.clientName || 'Cliente não identificado') : '—'"></p>
              <p class="text-[11px] text-slate-500" x-text="invoicePreview ? (invoicePreview.clientPhone || '') : ''"></p>
            </div>
            <div class="sm:text-right">
              <p class="text-[10px] font-bold uppercase tracking-wide text-slate-500">Lote</p>
              <p class="text-sm font-bold mt-1" x-text="invoicePreview ? (invoicePreview.loteCode || '—') : '—'"></p>
              <p class="text-[11px] text-slate-500" x-text="invoicePreview ? (invoicePreview.product || 'Frango de corte') : '—'"></p>
            </div>
          </div>

          <div class="overflow-hidden">
            <table class="w-full text-sm">
              <thead class="bg-slate-900 text-white">
                <tr><th class="px-4 py-3 text-left text-[10px] uppercase tracking-wide">Descrição</th><th class="px-4 py-3 text-right text-[10px] uppercase tracking-wide">Quantidade</th><th class="px-4 py-3 text-right text-[10px] uppercase tracking-wide">Preço</th><th class="px-4 py-3 text-right text-[10px] uppercase tracking-wide">Total</th></tr>
              </thead>
              <tbody>
                <tr class="border-b border-slate-200">
                  <td class="px-4 py-4 font-semibold" x-text="invoicePreview ? (invoicePreview.product || 'Frango de corte') : '—'"></td>
                  <td class="px-4 py-4 text-right" x-text="invoicePreview ? ((invoicePreview.qty || 0) + ' un.') : '0 un.'"></td>
                  <td class="px-4 py-4 text-right" x-text="invoicePreview ? fmtMT(invoicePreview.priceUnit) : '0,00 MT'"></td>
                  <td class="px-4 py-4 text-right font-black" x-text="invoicePreview ? fmtMT(invoicePreview.totalAmount) : '0,00 MT'"></td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="p-5 sm:p-6 border-t border-slate-200">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
              <div class="space-y-2 text-xs">
                <div class="flex justify-between gap-4"><span>Forma de pagamento</span><strong x-text="invoicePreview ? (invoicePreview.paymentMethod || '—') : '—'"></strong></div>
                <div class="flex justify-between gap-4"><span>Estado</span><strong x-text="invoicePreview ? (invoicePreview.paymentStatus || ((Number(invoicePreview.debtAmount)||0) > 0 ? 'Pendente' : 'Pago')) : '—'"></strong></div>
                <div class="flex justify-between gap-4"><span>Valor pago</span><strong x-text="invoicePreview ? fmtMT(invoicePreview.paidAmount) : '0,00 MT'"></strong></div>
                <div class="flex justify-between gap-4"><span>Saldo em dívida</span><strong x-text="invoicePreview ? fmtMT(invoicePreview.debtAmount) : '0,00 MT'"></strong></div>
              </div>
              <div class="sm:text-right space-y-1">
                <p class="text-[10px] uppercase tracking-wide text-slate-500">Total da factura</p>
                <p class="text-3xl font-black text-slate-900" x-text="invoicePreview ? fmtMT(invoicePreview.totalAmount) : '0,00 MT'"></p>
              </div>
            </div>
          </div>

          <div class="p-5 sm:p-6 border-t border-slate-200 flex items-end justify-between gap-6">
            <div>
              <p class="text-[10px] uppercase tracking-wide text-slate-500">Emitido por</p>
              <p class="text-sm font-bold mt-1" x-text="invoicePreview ? (invoicePreview.responsible || (currentUser && currentUser.nome) || '—') : '—'"></p>
            </div>
            <div class="text-center min-w-[190px]" x-show="invoicePreview && invoicePreview.settings && (invoicePreview.settings.signatureImage || invoicePreview.settings.signatureName)">
              <template x-if="invoicePreview && invoicePreview.settings && invoicePreview.settings.signatureImage">
                <img :src="invoicePreview.settings.signatureImage" alt="Assinatura da empresa" class="h-14 max-w-[190px] object-contain mx-auto">
              </template>
              <template x-if="invoicePreview && invoicePreview.settings && !invoicePreview.settings.signatureImage">
                <div class="h-9 border-b border-slate-300"></div>
              </template>
              <p class="mt-1 text-[10px] font-semibold" x-text="invoicePreview && invoicePreview.settings ? invoicePreview.settings.signatureName : ''"></p>
              <p class="text-[10px] text-slate-500" x-text="invoicePreview && invoicePreview.settings ? invoicePreview.settings.signatureTitle : ''"></p>
            </div>
          </div>
        </div>

        <div class="invoice-action-bar mt-5 flex flex-wrap justify-end gap-2">
          <button type="button" class="btn btn-ghost" @click="printSaleInvoice()"><span x-html="getIcon('print')"></span> Imprimir</button>
          <button type="button" class="btn btn-primary font-bold" @click="downloadSaleInvoicePDF()"><span x-html="getIcon('pdf')"></span> Baixar PDF</button>
        </div>
      </div>
    </div>
  </div>
</div>
</template>
