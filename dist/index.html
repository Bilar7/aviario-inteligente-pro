<style id="boot-critical-css">
  html,body{margin:0;min-height:100%;width:100%;background:#eef6f2;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  body:not(.light){background:#07110f}
  .boot-screen{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;min-height:100dvh;overflow:hidden;background:#eef6f2}
  .boot-backdrop{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.12),rgba(255,255,255,.12)),url("https://i.pinimg.com/736x/fc/43/00/fc430077a0ef00efdf4d26e667ea5a43.jpg");background-position:center;background-size:cover;transform:scale(1.02)}
  .boot-backdrop:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.28))}
  .boot-panel{position:relative;z-index:2;width:min(430px,calc(100vw - 32px));padding:34px 30px 28px;text-align:center;border-radius:28px;background:rgba(255,255,255,.96);border:1px solid rgba(255,255,255,.9);box-shadow:0 28px 90px rgba(15,23,42,.18)}
  .boot-brandmark{width:78px;height:78px;display:grid;place-items:center;margin:-58px auto 16px;border-radius:22px;background:#0bbf79;border:4px solid #fff;box-shadow:0 14px 30px rgba(16,185,129,.26);overflow:hidden}
  .boot-brandmark img{width:100%;height:100%;-o-object-fit:contain;object-fit:contain}
  .boot-kicker{font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#0f9f66}
  .boot-title{margin-top:4px;font-size:30px;font-weight:900;letter-spacing:.08em;color:#0f172a;line-height:1.1}
  .boot-subtitle{margin-top:7px;font-size:15px;font-weight:700;color:#16a34a}
  .boot-progress{height:5px;margin:24px 0 12px;overflow:hidden;border-radius:999px;background:#dfece5}
  .boot-progress span{display:block;width:34%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#10b981,#22c55e);animation:bootProgress 1.2s ease-in-out infinite}
  .boot-status{font-size:13px;color:#64748b}
  .boot-brand{margin-top:16px;font-size:10px;font-weight:700;letter-spacing:.12em;color:#94a3b8}
  .boot-secure{margin-top:10px;font-size:10px;color:#a0aca8}
  @keyframes bootProgress{0%{transform:translateX(-140%)}100%{transform:translateX(340%)}}
  body:not(.light) .boot-screen{background:#07110f}
  body:not(.light) .boot-backdrop:after{background:linear-gradient(180deg,rgba(5,15,12,.12),rgba(5,15,12,.20))}
  body:not(.light) .boot-panel{background:rgba(10,24,20,.96);border-color:rgba(74,222,128,.16);box-shadow:0 30px 90px rgba(0,0,0,.36)}
  body:not(.light) .boot-title{color:#f8fafc}
  body:not(.light) .boot-status{color:#b7c8c2}
  body:not(.light) .boot-brand{color:#7c8d87}
  body:not(.light) .boot-secure{color:#657872}
  @media(max-width:639px){.boot-panel{width:min(370px,calc(100vw - 24px));padding:30px 20px 24px;border-radius:24px}.boot-brandmark{width:70px;height:70px;margin:-52px auto 14px}.boot-title{font-size:25px}.boot-subtitle{font-size:14px}.boot-backdrop{background-position:center center}}
</style>

<script>
(function(){
  try {
    var theme = localStorage.getItem('aviario_theme');
    if (theme === 'light') document.body.classList.add('light');
  } catch (e) {}
})();
</script>
<div id="boot-screen" class="boot-screen" aria-live="polite" aria-label="A iniciar o Aviário Inteligente Pro">

    <div class="boot-title">AVIÁRIO</div>
    <div class="boot-subtitle">Gestão Inteligente</div>
    <div class="boot-progress" aria-hidden="true"><span></span></div>
    <div class="boot-status">A preparar o seu ambiente</div>
    <div class="boot-brand">Produção avícola • Gestão • Resultados</div>
    <div class="boot-secure">Ambiente seguro e pronto para iniciar</div>
  </div>
</div><div id="app-root"></div>
